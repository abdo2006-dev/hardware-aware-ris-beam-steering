<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CST RIS unit cell shown from top, side, and oblique views</title>
  <desc id="desc">A dimensioned schematic of a periodic 5.35 millimeter RIS cell with two copper patches, a central gap bridged by a lumped RLC element, a horizontal slot, and a 0.5 millimeter RT duroid 5880 substrate.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#526579"/></marker>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dff4f2"/><stop offset="1" stop-color="#a9d8d5"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6bd55"/><stop offset="1" stop-color="#cf8124"/></linearGradient>
    <style>
      .bg{fill:#f4f7fb}.card{fill:#fff;stroke:#d7e0e9;stroke-width:2}.title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#12263a}.subtitle{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#526579}.h{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#17324d}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#263b50}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#526579}.tiny{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#526579}.dim{stroke:#526579;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.lead{stroke:#526579;stroke-width:1.5;fill:none}.metal2{fill:url(#metal);stroke:#9b5d1b;stroke-width:2}.gap{fill:#24394d}.slot{fill:#dff4f2}.load{fill:#3e7cbb;stroke:#174a76;stroke-width:2}.axis{stroke:#536f88;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900" rx="18"/>
  <text class="title" x="56" y="64">CST unit-cell design | three views</text>
  <text class="subtitle" x="56" y="96">Periodic RIS element reconstructed in CST Studio Suite 2023. Geometry views are redrawn from the model dimensions for clarity.</text>

  <!-- Top view -->
  <rect class="card" x="48" y="132" width="650" height="610" rx="14"/>
  <text class="h" x="78" y="176">A. Top view | copper layout and load bridge</text>
  <text class="small" x="78" y="202">One periodic cell; the in-plane boundaries repeat this pattern.</text>
  <rect x="145" y="270" width="430" height="430" rx="3" fill="url(#board)" stroke="#486879" stroke-width="2.5"/>
  <rect class="metal2" x="195" y="320" width="153" height="330" rx="2"/>
  <rect class="metal2" x="372" y="320" width="153" height="330" rx="2"/>
  <rect class="slot" x="195" y="470" width="330" height="50"/>
  <rect class="gap" x="348" y="320" width="24" height="330"/>
  <rect class="load" x="342" y="480" width="36" height="30" rx="5"/>
  <text x="360" y="501" text-anchor="middle" style="font:700 12px 'Segoe UI',Arial,sans-serif;fill:#fff">RLC</text>
  <line class="dim" x1="145" y1="244" x2="575" y2="244"/>
  <text class="label" x="360" y="232" text-anchor="middle">5.35 mm cell pitch</text>
  <line class="dim" x1="195" y1="675" x2="525" y2="675"/>
  <text class="small" x="360" y="698" text-anchor="middle">2.8 mm interpreted copper-pair width</text>
  <path class="lead" d="M348 453 L305 420 L215 420"/>
  <text class="small" x="208" y="414" text-anchor="end">0.30 mm central gap</text>
  <path class="lead" d="M285 470 L255 438 L206 438"/>
  <text class="small" x="200" y="442" text-anchor="end">2.0 × 0.4 mm slot</text>
  <path class="lead" d="M378 495 L450 555 L545 555"/>
  <text class="small" x="548" y="560">Series lumped RLC bridge</text>
  <text class="small" x="360" y="725" text-anchor="middle">Patch length: 3.5 mm | Dimensions follow Table I and a documented drawing interpretation.</text>

  <!-- Side view -->
  <rect class="card" x="720" y="132" width="310" height="610" rx="14"/>
  <text class="h" x="750" y="176">B. Side view</text>
  <text class="small" x="750" y="202">Layer stack (thickness not to scale)</text>
  <line x1="770" y1="445" x2="855" y2="445" stroke="#9b5d1b" stroke-width="12"/>
  <line x1="900" y1="445" x2="980" y2="445" stroke="#9b5d1b" stroke-width="12"/>
  <rect x="770" y="457" width="210" height="118" fill="url(#board)" stroke="#486879" stroke-width="2"/>
  <rect x="770" y="575" width="210" height="9" fill="#9aa8b7"/>
  <rect class="load" x="855" y="426" width="45" height="19" rx="4"/>
  <text class="small" x="875" y="617" text-anchor="middle">0.5 mm RT/duroid 5880</text>
  <text class="small" x="875" y="644" text-anchor="middle">Copper layer on one face</text>
  <path class="lead" d="M790 445 L770 389 L752 389"/><text class="tiny" x="750" y="382">35 µm copper*</text>
  <path class="lead" d="M900 435 L940 365 L975 365"/><text class="tiny" x="978" y="369">Lumped bridge</text>
  <line class="dim" x1="1000" y1="457" x2="1000" y2="575"/>
  <text class="tiny" x="1006" y="520">0.5 mm</text>
  <text class="tiny" x="750" y="710">*Copper thickness is an engineering assumption.</text>

  <!-- Oblique view -->
  <rect class="card" x="1052" y="132" width="340" height="610" rx="14"/>
  <text class="h" x="1082" y="176">C. Oblique view</text>
  <text class="small" x="1082" y="202">Cell thickness and copper pattern together</text>
  <!-- substrate prism -->
  <polygon points="1100,470 1250,520 1340,465 1190,415" fill="url(#board)" stroke="#486879" stroke-width="2.5"/>
  <polygon points="1100,470 1250,520 1250,605 1100,555" fill="#9dcac8" stroke="#486879" stroke-width="2.5"/>
  <polygon points="1250,520 1340,465 1340,550 1250,605" fill="#77aaa9" stroke="#486879" stroke-width="2.5"/>
  <!-- copper patches on top face, simplified as inset parallelograms -->
  <polygon class="metal2" points="1130,465 1187,484 1187,432 1130,413"/>
  <polygon class="metal2" points="1203,490 1260,509 1312,477 1255,458"/>
  <polygon points="1187,432 1203,438 1203,490 1187,484" class="gap"/>
  <polygon points="1186,455 1204,461 1257,448 1239,442" fill="#dff4f2"/>
  <polygon class="load" points="1186,454 1203,460 1215,453 1198,447"/>
  <path class="lead" d="M1200 450 L1260 365 L1320 365"/><text class="small" x="1324" y="370">RLC bridge</text>
  <path class="lead" d="M1135 485 L1095 565 L1084 565"/><text class="small" x="1082" y="588">Substrate slab</text>
  <line class="axis" x1="1110" y1="670" x2="1162" y2="670"/><text class="tiny" x="1168" y="675">x</text>
  <line class="axis" x1="1110" y1="670" x2="1088" y2="632"/><text class="tiny" x="1078" y="627">y</text>
  <line class="axis" x1="1110" y1="670" x2="1110" y2="618"/><text class="tiny" x="1105" y="610">z</text>
  <text class="tiny" x="1082" y="710">Illustrative view; not a CST viewport capture.</text>

  <rect x="48" y="770" width="1344" height="78" rx="12" fill="#eaf0f6"/>
  <text class="label" x="76" y="803">Model basis:</text>
  <text class="small" x="180" y="803">RT/duroid 5880, εr = 2.2, tanδ = 0.0009; 5.35 mm periodic pitch; paired patches; central slot and lumped bridge.</text>
  <text class="small" x="76" y="829">This drawing clarifies the geometry used in CST. Exact copper thickness, terminal width, and some axis/dimension assignments are assumptions documented in docs/model-and-methods.md.</text>
</svg>

